name: tests

on:
  push:
    branches: [main, master, dev]
  pull_request:
  workflow_dispatch:

jobs:
  selftest:
    # 只跑"纯 Python、无需 GPU / 无需模型 / 无需密钥"的六套自检。
    # 真实模型调用（--with-llm）与真实抠图（--with-matting）需要密钥与权重，
    # 属于本地验收范畴，不放进 CI。
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 安装依赖（不含可选的重型依赖）
        run: |
          python -m pip install --upgrade pip
          # 自检六套只需要核心依赖；torch/opencv 等留给本地验收
          pip install fastapi "uvicorn[standard]" pillow numpy httpx python-multipart
      - name: 注册表与算子自检
        run: python tools/selftest_ops.py
      - name: 文档/像素端到端自检
        run: python tools/selftest_doc.py
      - name: 技能包自检
        run: python tools/selftest_skills.py
      - name: 对话链路自检（假模型）
        run: python tools/selftest_agent.py
      - name: 畸形 JSON 容错体检
        run: python tools/check_json_tolerance.py
      - name: 前端静态守卫与退出链路
        run: python tools/selftest_shutdown.py
